
name: Build Open Applications APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Open App.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          mkdir android-project
          unzip -o "Open App.zip" -d android-project

      - name: Compilar APK
        run: gradle -p android-project assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenApplications-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
